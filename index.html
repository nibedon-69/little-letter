<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A Little Letter 💌</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Georgia,"Times New Roman",serif;color:#49363b;background:#f9eee9}
.scene{height:100%;display:grid;place-items:center;position:relative;overflow:hidden;perspective:1200px;background:
radial-gradient(circle at 50% 35%,#fffdf8 0,rgba(255,253,248,.7) 22%,transparent 55%),
linear-gradient(135deg,#f8e7e9,#fbf3df 55%,#e7f1f2)}
.scene:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(60,35,40,.13));pointer-events:none}
.glow{position:absolute;width:65vmin;height:65vmin;border-radius:50%;background:rgba(255,185,205,.25);filter:blur(55px);animation:pulse 6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.65}}
.petal{position:absolute;top:-10vh;font-size:20px;opacity:0;animation:fall linear infinite;pointer-events:none}
@keyframes fall{0%{transform:translate3d(0,-10vh,0) rotate(0);opacity:0}12%{opacity:.7}88%{opacity:.7}100%{transform:translate3d(15vw,115vh,0) rotate(330deg);opacity:0}}
.intro{text-align:center;z-index:2;transition:opacity .65s,transform .8s}
.intro.hide{opacity:0;transform:scale(.88) translateY(-20px);pointer-events:none}
h1{font-size:clamp(28px,7vw,48px);font-weight:normal;margin:0 0 10px}
.sub{font-family:system-ui,sans-serif;color:#806c73;margin-bottom:32px}

.envelopeWrap{position:relative;width:min(82vw,370px);height:235px;cursor:pointer;perspective:1200px;filter:drop-shadow(0 22px 20px rgba(65,35,45,.2));animation:float 4s ease-in-out infinite;touch-action:manipulation}
@keyframes float{50%{transform:translateY(-7px)}}
.envelope{position:absolute;inset:0;background:linear-gradient(145deg,#f8ccd6,#efb0c1);border-radius:10px;overflow:hidden;box-shadow:inset 0 1px rgba(255,255,255,.7),0 12px 28px rgba(80,40,55,.15);transition:transform .7s}
.envelope:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.35),transparent 40%,rgba(150,70,90,.08));z-index:1}
.envelope:after{content:"";position:absolute;left:0;right:0;bottom:0;height:75%;background:linear-gradient(160deg,#f0b4c4,#e8a6b8);clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);z-index:4}
.paper{
position:absolute;z-index:3;left:7%;width:86%;height:91%;top:8%;
background:#fffdf7;border-radius:3px;box-shadow:0 3px 12px rgba(70,40,40,.2);
transform:translateY(70px);transition:transform 1.25s cubic-bezier(.16,1,.3,1);
}
.paper:before{content:"💌";position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:25px}
.fold{
position:absolute;z-index:5;left:10%;width:80%;height:42%;
background:linear-gradient(105deg,#fffdf8,#f4eee7,#fffdf8);
box-shadow:0 2px 9px rgba(65,40,40,.13);
opacity:0;pointer-events:none;
transform-origin:center;
transition:opacity .35s,transform .8s cubic-bezier(.16,1,.3,1);
}
.fold-a{top:20%;transform:rotateX(90deg) translateY(35px)}
.fold-b{top:42%;transform:rotateX(-90deg) translateY(-25px)}
.envelopeWrap.open .fold-a{
opacity:.9;transform:rotateX(0) translateY(-10px);transition-delay:.42s
}
.envelopeWrap.open .fold-b{
opacity:.9;transform:rotateX(0) translateY(5px);transition-delay:.65s
}
.flap{position:absolute;z-index:6;top:0;left:0;width:100%;height:60%;background:linear-gradient(160deg,#f9d6de,#f5c2cf);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1.1s cubic-bezier(.16,1,.3,1);backface-visibility:hidden}
.flap:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.4),transparent 70%);transform:translateX(-120%);transition:transform .8s}
.seal{position:absolute;z-index:8;left:50%;top:52%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#dd7895,#b84e70);color:white;font-size:25px;box-shadow:0 6px 15px rgba(90,35,55,.3);transition:opacity .35s,transform .55s}
.envelopeWrap.open{animation:none}
.envelopeWrap.open .flap{transform:rotateX(180deg)}
.envelopeWrap.open .flap:after{transform:translateX(120%)}
.envelopeWrap.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.4)}
.envelopeWrap.open .paper{
transform:translateY(-105px) rotateX(-3deg);
transition-delay:.35s;
}
.envelopeWrap.open .envelope{transform:translateY(75px) scale(.96)}
.hint{font-family:system-ui,sans-serif;font-size:12px;margin-top:22px;color:#8d6c75;letter-spacing:2px;animation:hint 2s ease-in-out infinite}
@keyframes hint{50%{opacity:.45;transform:translateY(2px)}}

.letter{
position:absolute;z-index:20;width:min(89vw,630px);max-height:83vh;padding:48px 38px 38px;
background:#fffdf7;border-radius:4px;box-shadow:0 35px 90px rgba(55,30,35,.3);
border:1px solid #eadbd0;opacity:0;pointer-events:none;overflow:auto;
transform:translateY(180px) scale(.7) rotateX(14deg);transform-origin:center bottom;
transition:opacity .7s,transform 1.15s cubic-bezier(.16,1,.3,1);
}
.scene.letter-open .letter{opacity:1;pointer-events:auto;transform:translateY(0) scale(1) rotateX(0);transition-delay:1.15s}
.letter:before{content:"";position:absolute;inset:14px;border:1px solid #ead2d6;pointer-events:none}
.letter:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 25%,rgba(255,255,255,.6) 50%,transparent 75%);transform:translateX(-120%);animation:shine 1.3s 2s ease-out forwards;pointer-events:none}
@keyframes shine{to{transform:translateX(120%)}}
.letter h2{font-size:clamp(27px,6vw,38px);font-weight:normal;margin:0 0 27px;text-align:center;color:#9e4964;opacity:0;transform:translateY(15px);animation:in .7s 1.9s forwards}
.message{font-size:clamp(19px,4.7vw,25px);line-height:1.85;position:relative;z-index:1}
.message p{
margin:0 0 14px;opacity:0;transform:translateY(18px);
animation:in .7s forwards;
}
.message p:nth-child(1){animation-delay:2.15s}
.message p:nth-child(2){animation-delay:2.4s}
.message p:nth-child(3){animation-delay:2.65s}
.message p:nth-child(4){animation-delay:2.9s}
.message p span{
display:inline-block;
animation:inkGlow .9s ease-out forwards;
}
.message p:nth-child(1) span{animation-delay:2.45s}
.message p:nth-child(2) span{animation-delay:2.7s}
.message p:nth-child(3) span{animation-delay:2.95s}
.message p:nth-child(4) span{animation-delay:3.2s}
@keyframes inkGlow{
0%{opacity:.25;filter:blur(2px);transform:translateY(2px)}
55%{opacity:1;filter:blur(0);transform:translateY(0)}
100%{opacity:1;filter:none;transform:none}
}
@keyframes in{to{opacity:1;transform:none}}
.c1{color:#e05b83}.c2{color:#e69b3c}.c4{color:#7771bd}.c5{color:#d25d9c}
.close{display:block;margin:27px auto 0;border:0;background:#f1c3cf;color:#6f3e4d;border-radius:30px;padding:10px 21px;font-family:system-ui,sans-serif;cursor:pointer;opacity:0;animation:in .6s 3.55s forwards}
.spark{position:absolute;z-index:30;pointer-events:none;font-size:18px;animation:spark .9s ease-out forwards}
@keyframes spark{from{opacity:1;transform:translate(0,0) scale(.4) rotate(0)}to{opacity:0;transform:translate(var(--x),var(--y)) scale(1.35) rotate(180deg)}}
@media(max-height:620px){.envelopeWrap{height:185px}.letter{max-height:91vh;padding:30px 25px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="scene" id="scene">
<div class="glow"></div>
<div class="petal" style="left:8%;animation-duration:8s;animation-delay:-2s">🌻</div>
<div class="petal" style="left:25%;animation-duration:10s;animation-delay:-7s">🌸</div>
<div class="petal" style="left:62%;animation-duration:9s;animation-delay:-4s">✨</div>
<div class="petal" style="left:83%;animation-duration:11s;animation-delay:-8s">🌼</div>

<div class="intro" id="intro">
<h1>A little letter for you 💌</h1>
<div class="sub">Someone left this here just for you…</div>
<div class="envelopeWrap" id="env" role="button" tabindex="0" aria-label="Tap to open the letter">
<div class="envelope"></div>
<div class="paper"></div>
<div class="fold fold-a"></div>
<div class="fold fold-b"></div>
<div class="flap"></div>
<div class="seal">♥</div>
</div>
<div class="hint">TAP THE ENVELOPE TO OPEN</div>
</div>

<article class="letter" id="letter">
<h2>Hello dear,</h2>
<div class="message">
<p>It's a <span class="c1">lovely day!</span>🌻</p>
<p>I have nothing to write just because <span class="c2">I don't know you actually!</span>😝 Hehehe!</p>
<p>Have a <span class="c4">good day.</span></p>
<p><span class="c5">Tata!</span>👋</p>
</div>
<button class="close" id="close">Close letter</button>
</article>
</div>
<script>
const env=document.getElementById('env'),intro=document.getElementById('intro'),close=document.getElementById('close'),scene=document.getElementById('scene');
function burst(){
const symbols=['✨','💗','🌸','✦','·'];
for(let i=0;i<18;i++){
const s=document.createElement('span');s.className='spark';s.textContent=symbols[Math.floor(Math.random()*symbols.length)];
s.style.left='50%';s.style.top='50%';s.style.setProperty('--x',(Math.random()*330-165)+'px');s.style.setProperty('--y',(Math.random()*230-115)+'px');
scene.appendChild(s);setTimeout(()=>s.remove(),1000);
}}
function openLetter(){if(env.classList.contains('open'))return;burst();env.classList.add('open');intro.classList.add('hide');scene.classList.add('letter-open')}
function closeLetter(){env.classList.remove('open');intro.classList.remove('hide');scene.classList.remove('letter-open')}
env.addEventListener('click',openLetter);
env.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')openLetter()});
close.addEventListener('click',closeLetter);
</script>
</body>
</html>
